name: Bazel CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout 仓库
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ 手动安装 Bazelisk（用户空间）
      - name: Install Bazelisk manually
        run: |
          echo "== Downloading Bazelisk =="
          mkdir -p $HOME/bin
          wget -O $HOME/bin/bazelisk https://github.com/bazelbuild/bazelisk/releases/download/v1.27.0/bazelisk-linux-amd64
          chmod +x $HOME/bin/bazelisk
          echo "$HOME/bin" >> $GITHUB_PATH
          echo "== Bazelisk version =="
          bazelisk version

      # 3️⃣ 构建项目
      - name: Build project
        run: |
          echo "== Start building =="
          bazelisk build //cpp_demo/...

      # 4️⃣ 运行测试
      - name: Run tests
        run: |
          echo "== Run tests =="
          bazelisk test //python_bind6/...

      # 5️⃣ 上传构建产物（可选）
      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bazel-bin-artifacts
          path: bazel-bin/

name: Bazel CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout 仓库代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Bazelisk（官方推荐）
      - name: Setup Bazelisk (official)
        uses: bazelbuild/setup-bazelisk@v2
        with:
          bazelisk-cache: true  # ✅ 启用缓存加速

      # 3️⃣ 显示 Bazel/Bazelisk 版本信息
      - name: Check Bazel version
        run: |
          bazel version

      # 4️⃣ 构建项目
      - name: Bazel build
        run: |
          bazel build //cpp_demo/...

      # 5️⃣ 运行测试
      - name: Bazel test
        run: |
          bazel test //python_bind6/...

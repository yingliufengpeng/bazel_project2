name: Bazel CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout 仓库
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ 安装 Bazelisk（官方维护版本）
      - name: Setup Bazelisk
        uses: bazelbuild/setup-bazelisk@v2
        with:
          bazelisk-version: "v1.27.0"
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          ACTIONS_CACHE_URL: ""   # ✅ 禁止 Bazelisk 缓存，避免 "Cache service responded with 400"

      # 3️⃣ 显示 Bazelisk / Bazel 版本
      - name: Verify Bazelisk and Bazel
        run: |
          which bazelisk
          bazelisk version

      # 4️⃣ 构建项目
      - name: Build project
        run: |
          bazelisk build //cpp_demo/...

      # 5️⃣ 运行测试
      - name: Run Bazel tests
        run: |
          bazelisk test //python_bind6/...

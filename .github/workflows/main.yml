name: Bazel CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout 仓库
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Bazelisk (官方推荐)
      - name: Setup Bazelisk (official)
        uses: bazelbuild/setup-bazelisk@v2
        with:
          bazelisk-version: "v1.27.0"   # ✅ 指定一个稳定版本
          token: ${{ secrets.GITHUB_TOKEN }}

      # 3️⃣ 查看 Bazel 版本
      - name: Check Bazel version
        run: |
          bazel version

      # 4️⃣ 构建项目
      - name: Bazel build
        run: |
          bazel build //cpp_demo/...

      # 5️⃣ 运行测试
      - name: Bazel test
        run: |
          bazel test //python_bind6/...

name: Bazel CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout 仓库
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ 安装 Bazelisk（关闭缓存）
      - name: Setup Bazelisk
        uses: bazelbuild/setup-bazelisk@v2
        with:
          bazelisk-version: "v1.27.0"
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          ACTIONS_CACHE_URL: "none"   # 🚫 明确禁用 cache
          ACTIONS_RUNTIME_TOKEN: ""   # 🚫 不传 runtime token，彻底关闭缓存 API

      # 3️⃣ 显示版本
      - name: Check Bazelisk version
        run: |
          which bazelisk
          bazelisk version

      # 4️⃣ 构建
      - name: Build with Bazel
        run: |
          bazelisk build //cpp_demo/...

      # 5️⃣ 测试
      - name: Test with Bazel
        run: |
          bazelisk test //python_bind6/...
